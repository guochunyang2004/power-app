name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  publish:
    name: Publish to GitHub & Gitee
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "Power App ${{ github.ref_name }}" \
            --notes "## Power App ${{ github.ref_name }}

          多平台安装包已就绪，请下载对应平台的安装包。

          | 平台 | 格式 |
          |------|------|
          | Windows | .exe (NSIS) / .msi |
          | Linux | .deb / .rpm / .AppImage |
          | macOS | .dmg |" \
            release-files/*

      - name: Create Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        if: env.GITEE_TOKEN != ''
        run: |
          set -e
          TAG_NAME="${{ github.ref_name }}"
          OWNER="guochunyang2004"
          REPO="power-app"
          API="https://gitee.com/api/v5"

          RELEASE_BODY="Power App ${TAG_NAME} - 多平台安装包已就绪"

          # Create Gitee release
          echo "Creating Gitee release for tag: ${TAG_NAME}"
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${API}/repos/${OWNER}/${REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg token "${GITEE_TOKEN}" \
              --arg tag "${TAG_NAME}" \
              --arg name "Power App ${TAG_NAME}" \
              --arg body "${RELEASE_BODY}" \
              --arg commit "master" \
              '{access_token: $token, tag_name: $tag, name: $name, body: $body, target_commitish: $commit}')")

          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -1)
          RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')
          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${RESPONSE}"

          if [ "$HTTP_CODE" != "201" ]; then
            echo "Failed to create Gitee release (HTTP ${HTTP_CODE})"
            exit 1
          fi

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "Gitee Release created: ID=${RELEASE_ID}"

          # Upload all artifact files
          for FILE in release-files/*; do
            if [ -f "$FILE" ]; then
              FILENAME=$(basename "$FILE")
              echo "Uploading: ${FILENAME}"
              UPLOAD_RESULT=$(curl -s -w "\n%{http_code}" -X POST "${API}/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "file=@${FILE}" \
                -F "access_token=${GITEE_TOKEN}")
              UPLOAD_CODE=$(echo "$UPLOAD_RESULT" | tail -1)
              if [ "$UPLOAD_CODE" = "201" ]; then
                echo "Uploaded: ${FILENAME}"
              else
                echo "Failed to upload ${FILENAME} (HTTP ${UPLOAD_CODE})"
              fi
            fi
          done

          echo "Gitee Release complete."
