name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  publish:
    name: Publish to GitHub & Gitee
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 'Power App ${{ github.ref_name }}'
          body: |
            ## Power App ${{ github.ref_name }}

            多平台安装包已就绪，请下载对应平台的安装包。

            | 平台 | 格式 |
            |------|------|
            | Windows | .exe (NSIS) / .msi |
            | Linux | .deb / .rpm / .AppImage |
            | macOS | .dmg |
          files: |
            artifacts/**/*

      - name: Create Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        if: env.GITEE_TOKEN != ''
        run: |
          TAG_NAME="${{ github.ref_name }}"
          OWNER="guochunyang2004"
          REPO="power-app"
          API="https://gitee.com/api/v5"

          # Create Gitee release
          RESPONSE=$(curl -s -X POST "${API}/repos/${OWNER}/${REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"Power App ${TAG_NAME}\",
              \"body\": \"## Power App ${TAG_NAME}\n\n多平台安装包已就绪，请下载对应平台的安装包。\n\n| 平台 | 格式 |\n|------|------|\n| Windows | .exe (NSIS) / .msi |\n| Linux | .deb / .rpm / .AppImage |\n| macOS | .dmg |\",
              \"target_commitish\": \"master\"
            }")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "Gitee Release created: ID=$RELEASE_ID"

          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "Failed to create Gitee release: $RESPONSE"
            exit 1
          fi

          # Upload all artifact files
          find artifacts -type f | while read -r FILE; do
            FILENAME=$(basename "$FILE")
            echo "Uploading: $FILENAME"
            curl -s -X POST "${API}/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${FILE}" \
              -F "access_token=${GITEE_TOKEN}"
            echo "Uploaded: $FILENAME"
          done

          echo "All artifacts uploaded to Gitee Release."
